name: auto-building

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: check
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: build
        run: g++ -std=c++11 win.cpp -o wc.exe -lws2_32 -lgdi32

      - name: up
        uses: actions/upload-artifact@v4
        with:
          name: wc
          path: wc.exe