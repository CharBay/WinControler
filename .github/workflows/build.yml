name: auto-building

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: check
        uses: actions/checkout@v4

      - name: Setup VS Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: build
        run: cl /EHsc win.cpp /Fe:wc.exe /link ws2_32.lib gdi32.lib user32.lib

      - name: up
        uses: actions/upload-artifact@v4
        with:
          name: wc
          path: wc.exe