name: auto-building

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: check
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: build with MSYS2
        shell: msys2 {0}
        run: g++ -std=c++11 win.cpp -o wc.exe -lws2_32 -lgdi32

      - name: up
        uses: actions/upload-artifact@v4
        with:
          name: wc
          path: wc.exe